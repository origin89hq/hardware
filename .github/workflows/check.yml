# Checks the committed Gerber set against the copper rules only the artwork can
# witness: the mounting-hole keep-outs and the antenna void, as the board's
# gerber-rules.json names them. It is red until an export passes; a red check
# here is the finding, not a nuisance.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gerbers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: just check
